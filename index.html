<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cost Share</title>
<meta name="description" content="Track shared travel costs, who paid, and who owes whom.">
<meta name="theme-color" content="#2747C4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cost Share">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M2 10h20" stroke="currentColor" stroke-width="1.8"/><circle cx="17" cy="15" r="1.6" fill="currentColor"/></svg>
      Cost Share <span id="net" class="net" hidden></span>
    </div>
    <div class="tripsel" id="tripsel"></div>
  </div>
  <div id="app"><div class="notice"><span class="muted">Loading your trips…</span></div></div>
  <div class="foot"><span>Exchange rates by <a href="https://www.exchangerate-api.com" target="_blank" rel="noopener">ExchangeRate-API</a></span><span>Works offline once opened</span></div>
</div>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>
<noscript>Cost Share needs JavaScript turned on.</noscript>
<script type="module" src="app.js"></script>
</body>
</html>
